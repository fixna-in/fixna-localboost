services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fixna
      POSTGRES_USER: fixna
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - fixna-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - fixna-redis:/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  fixna-postgres:
  fixna-redis:
