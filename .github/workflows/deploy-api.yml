# OPTIONAL: Deploy API to Fly.io (requires a payment method on Fly — see deployment.md).
# Recommended free path: Render (render.yaml) — no card, auto-deploy from Render dashboard.
# Prerequisites:
#   1. Fly app created + fly secrets import
#   2. GitHub secret FLY_API_TOKEN
name: Deploy API to Fly.io (optional)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test backend and deploy to Fly.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: mvn -f pom.xml test

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: fly deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
