# Render Blueprint — free-tier API (no credit card required).
# Dashboard: New → Blueprint → connect this repo.
# Set sync:false secrets in the Render dashboard after the first deploy.
# Database: use your existing Neon project (database fixna), not Render Postgres.
services:
  - type: web
    name: fixna-localboost-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: FIXNA_APP_ENV
        value: demo
      - key: FIXNA_AI_PROVIDER
        value: mock
      - key: FIXNA_PLATFORM_MODE
        value: mock
      - key: FIXNA_BILLING_DEFAULT_PLAN
        value: STARTER
      - key: OTEL_EXPORTER_OTLP_ENABLED
        value: false
      - key: FIXNA_HSTS_ENABLED
        value: true
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseContainerSupport -Xms256m -Xmx384m
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: FIXNA_JWT_SECRET
        sync: false
      - key: FIXNA_CORS_ALLOWED_ORIGINS
        sync: false
