# Single local profile: persistent PostgreSQL installed on localhost.
# Supply POSTGRES_PASSWORD at runtime; never commit database credentials.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/localboost
    username: postgres
    password: ${POSTGRES_PASSWORD}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Schema migrations/validation are inherited; demo data is loaded separately.
fixna:
  test-data:
    enabled: false

management:
  otlp:
    tracing:
      export:
        enabled: false
logging:
  level:
    root: INFO
    in.fixna.platform: DEBUG

