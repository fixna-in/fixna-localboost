server:
  # SERVER_PORT for local dev; Render and other PaaS inject PORT.
  port: ${SERVER_PORT:${PORT:8080}}

spring:
  application:
    name: fixna-localboost-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fixna}
    username: ${POSTGRES_USER:fixna}
    password: ${POSTGRES_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    build:
      enabled: true
  health:
    redis:
      enabled: false
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
      export:
        enabled: ${OTEL_EXPORTER_OTLP_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    in.fixna.platform: INFO

fixna:
  app-env: ${FIXNA_APP_ENV:local}
  # Optional ISO-8601 deploy timestamp; defaults to Maven build-info time when unset.
  deployed-at: ${FIXNA_DEPLOYED_AT:}
  security:
    jwt:
      secret: ${FIXNA_JWT_SECRET:dev-only-secret-change-me-in-production-32bytes-minimum!!}
      access-ttl: ${FIXNA_JWT_ACCESS_TTL:PT15M}
      refresh-ttl: ${FIXNA_JWT_REFRESH_TTL:P7D}
    cors:
      # Comma-separated allowlist. Empty list refuses all cross-origin calls.
      allowed-origins: ${FIXNA_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    rate-limit:
      # Per IP per route on /api/v1/auth/**, sliding 60s window.
      per-ip-per-minute: ${FIXNA_RATE_LIMIT_PER_IP_PER_MINUTE:20}
    # Strict-Transport-Security is only set when enabled AND the deployment
    # serves HTTPS (off by default; enable via env on TLS-terminated hosts).
    hsts-enabled: ${FIXNA_HSTS_ENABLED:false}
  ai:
    provider: ${FIXNA_AI_PROVIDER:mock}
    # Quota: max recommendations per tenant per UTC day.
    daily-quota: ${FIXNA_AI_DAILY_QUOTA:50}
  platform:
    # mock adapters work everywhere; real provider endpoints/keys configured later.
    default-mode: ${FIXNA_PLATFORM_MODE:mock}
  billing:
    default-plan: ${FIXNA_BILLING_DEFAULT_PLAN:FREE}

